{% macro icon(name) -%}
<svg class="sico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
{%- if name == "dash" -%}
  <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
{%- elif name == "clock" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>
{%- elif name == "txn" -%}
  <path d="M3.5 7h14m0 0-3.2-3.2M17.5 7l-3.2 3.2"/>
  <path d="M20.5 17h-14m0 0 3.2-3.2M6.5 17l3.2 3.2"/>
{%- elif name == "people" -%}
  <circle cx="9.5" cy="7.5" r="3.6"/>
  <path d="M2.8 20a6.7 6.7 0 0 1 13.4 0"/>
  <path d="M16.5 11a2.9 2.9 0 1 0 0-5.8M18 20a5.6 5.6 0 0 0-1.8-4.1"/>
{%- elif name == "loans" -%}
  <path d="M4 8h13.5m0 0L14 4.6M17.5 8 14 11.4"/>
  <path d="M20 16H6.5m0 0L10 12.6M6.5 16 10 19.4"/>
{%- elif name == "reports" -%}
  <path d="M7 3h7l4 4v14H7z"/><path d="M13.5 3.2V7.5H18"/>
  <path d="M10 12h6M10 15.6h6"/>
{%- elif name == "gear" -%}
  <path d="M4 7.5h8M17 7.5h3M16 5.5v4M4 16.5h3M11 16.5h9M8 14.5v4"/>
{%- elif name == "exit" -%}
  <path d="M15 3h4.2A1.8 1.8 0 0 1 21 4.8v14.4a1.8 1.8 0 0 1-1.8 1.8H15"/>
  <path d="M10 16.5 5.5 12 10 7.5M5.5 12H15"/>
{%- elif name == "search" -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/>
{%- elif name == "bell" -%}
  <path d="M6.2 8.4a5.8 5.8 0 0 1 11.6 0c0 6.6 2.7 7.8 2.7 7.8H3.5s2.7-1.2 2.7-7.8Z"/>
  <path d="M10.4 20.5a1.85 1.85 0 0 0 3.2 0"/>
{%- elif name == "plus" -%}
  <path d="M12 5v14M5 12h14"/>
{%- endif -%}
</svg>
{%- endmacro %}
